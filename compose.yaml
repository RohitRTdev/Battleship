name: ${COMPOSE_PROJECT_NAME:-battleship}

x-topology-environment: &topology-environment
  APP_ENV: dev
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  HTTP_PORT: "8080"
  AUTH_HTTP_ENDPOINT: http://auth-service:8080

x-node-healthcheck: &node-healthcheck
  test:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  interval: 3s
  timeout: 2s
  retries: 20
  start_period: 10s

x-etcd-environment: &etcd-environment
  ETCD_DATA_DIR: /var/lib/etcd
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  # etcd keeps every revision of every key until compacted; history older than an hour is not needed.
  ETCD_AUTO_COMPACTION_MODE: periodic
  ETCD_AUTO_COMPACTION_RETENTION: 1h

x-control-environment: &control-environment
  <<: *etcd-environment
  ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
  ETCD_INITIAL_CLUSTER_TOKEN: battleship-etcd

x-data-a-environment: &data-a-environment
  <<: *etcd-environment
  ETCD_INITIAL_CLUSTER: data-a-1=http://data-a-1:2380,data-a-2=http://data-a-2:2380,data-a-3=http://data-a-3:2380
  ETCD_INITIAL_CLUSTER_TOKEN: battleship-data-a

x-data-b-environment: &data-b-environment
  <<: *etcd-environment
  ETCD_INITIAL_CLUSTER: data-b-1=http://data-b-1:2380,data-b-2=http://data-b-2:2380,data-b-3=http://data-b-3:2380
  ETCD_INITIAL_CLUSTER_TOKEN: battleship-data-b

x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.6.15
  restart: unless-stopped
  expose:
    - "2379"
    - "2380"
  networks:
    - battleship-net
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 3s
    timeout: 2s
    retries: 20
    start_period: 10s

x-backend-environment: &backend-environment
  <<: *topology-environment
  SERVICE_NAME: game-service
  DISABLE_TIMEOUT: ${DISABLE_TIMEOUT:-false}
  # A three-node control-plane cluster (etcd-1..3) holds players, matchmaking and where each game lives; two
  # three-node data clusters (a and b) hold the games. a and b seed the cluster registry on first start; after
  # that, manage clusters with `npm run clusters` (see README).
  ETCD_ENDPOINTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
  ETCD_DATA_CLUSTERS: a=data-a-1:2379,data-a-2:2379,data-a-3:2379;b=data-b-1:2379,data-b-2:2379,data-b-3:2379
  MATCH_ARCHIVE_PATH: /data/matches

x-backend-common: &backend-common
  image: battleship/game-service:dev
  build:
    context: .
    dockerfile: apps/game-service/Dockerfile
    target: dev
  restart: unless-stopped
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
    data-a-1:
      condition: service_healthy
    data-a-2:
      condition: service_healthy
    data-a-3:
      condition: service_healthy
    data-b-1:
      condition: service_healthy
    data-b-2:
      condition: service_healthy
    data-b-3:
      condition: service_healthy
  expose:
    - "8080"
  networks:
    - battleship-net
  healthcheck: *node-healthcheck

services:
  auth-service:
    image: battleship/auth-service:dev
    container_name: battleship-auth-service
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *topology-environment
      SERVICE_NAME: auth-service
      NODE_ID: auth-node-1
      DATABASE_PATH: /data/auth.db
      ENABLE_TEST_ROUTES: ${ENABLE_TEST_ROUTES:-false}
    volumes:
      - ./apps/auth-service/src:/workspace/apps/auth-service/src:ro
      - ./runtime/auth:/data
    expose:
      - "8080"
    networks:
      - battleship-net
    healthcheck: *node-healthcheck

  # The control plane.
  etcd-1:
    <<: *etcd-common
    container_name: battleship-etcd-1
    environment:
      <<: *control-environment
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes:
      - ./runtime/etcd/control-1:/var/lib/etcd

  etcd-2:
    <<: *etcd-common
    container_name: battleship-etcd-2
    environment:
      <<: *control-environment
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes:
      - ./runtime/etcd/control-2:/var/lib/etcd

  etcd-3:
    <<: *etcd-common
    container_name: battleship-etcd-3
    environment:
      <<: *control-environment
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes:
      - ./runtime/etcd/control-3:/var/lib/etcd

  # Data cluster a.
  data-a-1:
    <<: *etcd-common
    container_name: battleship-data-a-1
    environment:
      <<: *data-a-environment
      ETCD_NAME: data-a-1
      ETCD_ADVERTISE_CLIENT_URLS: http://data-a-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-a-1:2380
    volumes:
      - ./runtime/etcd/data-a-1:/var/lib/etcd

  data-a-2:
    <<: *etcd-common
    container_name: battleship-data-a-2
    environment:
      <<: *data-a-environment
      ETCD_NAME: data-a-2
      ETCD_ADVERTISE_CLIENT_URLS: http://data-a-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-a-2:2380
    volumes:
      - ./runtime/etcd/data-a-2:/var/lib/etcd

  data-a-3:
    <<: *etcd-common
    container_name: battleship-data-a-3
    environment:
      <<: *data-a-environment
      ETCD_NAME: data-a-3
      ETCD_ADVERTISE_CLIENT_URLS: http://data-a-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-a-3:2380
    volumes:
      - ./runtime/etcd/data-a-3:/var/lib/etcd

  # Data cluster b.
  data-b-1:
    <<: *etcd-common
    container_name: battleship-data-b-1
    environment:
      <<: *data-b-environment
      ETCD_NAME: data-b-1
      ETCD_ADVERTISE_CLIENT_URLS: http://data-b-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-b-1:2380
    volumes:
      - ./runtime/etcd/data-b-1:/var/lib/etcd

  data-b-2:
    <<: *etcd-common
    container_name: battleship-data-b-2
    environment:
      <<: *data-b-environment
      ETCD_NAME: data-b-2
      ETCD_ADVERTISE_CLIENT_URLS: http://data-b-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-b-2:2380
    volumes:
      - ./runtime/etcd/data-b-2:/var/lib/etcd

  data-b-3:
    <<: *etcd-common
    container_name: battleship-data-b-3
    environment:
      <<: *data-b-environment
      ETCD_NAME: data-b-3
      ETCD_ADVERTISE_CLIENT_URLS: http://data-b-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://data-b-3:2380
    volumes:
      - ./runtime/etcd/data-b-3:/var/lib/etcd

  backend-node-1:
    <<: *backend-common
    container_name: battleship-backend-node-1
    environment:
      <<: *backend-environment
      NODE_ID: backend-node-1
    volumes:
      - ./apps/game-service/src:/workspace/apps/game-service/src:ro
      - ./runtime/matches:/data/matches

  backend-node-2:
    <<: *backend-common
    container_name: battleship-backend-node-2
    environment:
      <<: *backend-environment
      NODE_ID: backend-node-2
    volumes:
      - ./apps/game-service/src:/workspace/apps/game-service/src:ro
      - ./runtime/matches:/data/matches

  backend-node-3:
    <<: *backend-common
    container_name: battleship-backend-node-3
    environment:
      <<: *backend-environment
      NODE_ID: backend-node-3
    volumes:
      - ./apps/game-service/src:/workspace/apps/game-service/src:ro
      - ./runtime/matches:/data/matches

  frontend:
    image: battleship/frontend:dev
    container_name: battleship-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-8000}
    depends_on:
      backend-node-1:
        condition: service_healthy
      backend-node-2:
        condition: service_healthy
      backend-node-3:
        condition: service_healthy
    volumes:
      - ./apps/frontend:/workspace/apps/frontend:ro
    expose:
      - "5173"
    networks:
      - battleship-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  gateway:
    image: battleship/gateway:dev
    container_name: battleship-gateway
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    environment:
      FRONTEND_PORT: "5173"
    depends_on:
      auth-service:
        condition: service_healthy
      backend-node-1:
        condition: service_healthy
      backend-node-2:
        condition: service_healthy
      backend-node-3:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    networks:
      - battleship-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-healthz"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

networks:
  battleship-net:
    name: battleship-net
    driver: bridge
